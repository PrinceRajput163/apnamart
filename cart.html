<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Apna Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #ff4757; --dark: #2f3640; --light: #f5f6fa; --white: #ffffff; --shadow: 0 5px 15px rgba(0,0,0,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

        header { background: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .logo h1 { font-size: 20px; font-weight: 700; color: var(--dark); }
        .logo h1 span { color: var(--primary); }
        
        .nav-links { list-style: none; display: flex; gap: 15px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; font-size: 14px; }
        .nav-links a.active, .nav-links a:hover { color: var(--primary); }
        .cart-badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 50px; font-size: 12px; font-weight: 600; }

        .container { padding: 40px 5%; display: grid; grid-template-columns: 1.5fr 1fr; gap: 25px; }
        .box { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); }
        .box h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }

        .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
        .form-control:focus { border-color: var(--primary); }

        .btn-order { background: #25d366; color: white; padding: 12px; border: none; border-radius: 30px; width: 100%; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; margin-top: 15px; }
        .btn-order:hover { background: #1ebd5a; }

        footer { background: var(--dark); color: var(--white); text-align: center; padding: 20px; font-size: 13px; margin-top: 40px; }

        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="a.png" alt="Logo">
                <h1>Apna <span>Mart</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Gifts</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> <span class="cart-badge" id="cartCount">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="box">
            <h2>Your Cart Items</h2>
            <div id="cartItemsList"></div>
        </div>

        <div class="box">
            <h2>Checkout & Address</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label>Aapka Naam</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter mobile" required>
                </div>
                <div class="form-group">
                    <label>Delivery Address / Location</label>
                    <textarea id="address" class="form-control" rows="2" placeholder="Dibiyapur address..." required></textarea>
                </div>
                <div style="font-weight: 700; font-size: 16px; margin: 15px 0;">Total: <span id="grandTotal" style="color:var(--primary);">₹0</span></div>
                <button type="submit" class="btn-order"><i class="fab fa-whatsapp"></i> Confirm Order on WhatsApp</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Apna Mart, Dibiyapur | Owner: Mr. Shyam Sundar Rajput</p>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            let list = document.getElementById('cartItemsList');
            let totalEl = document.getElementById('grandTotal');
            
            if (cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#777; padding:20px;">Cart khaali hai!</p>`;
                totalEl.innerText = "₹0";
                document.getElementById('cartCount').innerText = "0";
                return;
            }

            let html = '', total = 0, count = 0;
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                count += item.quantity;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="">
                        <div style="flex-grow:1; padding:0 10px;">
                            <div style="font-size:14px; font-weight:600;">${item.name}</div>
                            <div style="font-size:12px; color:#666;">₹${item.price} x ${item.quantity} = ₹${item.price * item.quantity}</div>
                        </div>
                        <button onclick="removeItem(${index})" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
            list.innerHTML = html;
            totalEl.innerText = `₹${total}`;
            document.getElementById('cartCount').innerText = count;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('apnaMartCart', JSON.stringify(cart));
            loadCart();
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            if (cart.length === 0) { alert('Cart khaali hai!'); return; }

            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let address = document.getElementById('address').value;

            let msg = `🛒 *New Order - Apna Mart* 🎁\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n*Items:*\n`;
            let total = 0;
            cart.forEach((i, idx) => {
                total += i.price * i.quantity;
                msg += `${idx+1}. ${i.name} (x${i.quantity}) = ₹${i.price * i.quantity}\n`;
            });
            msg += `\n*Total: ₹${total}*`;

            localStorage.removeItem('apnaMartCart');
            window.open(`https://wa.me/918923315930?text=${encodeURIComponent(msg)}`, '_blank');
            window.location.href = "index.html";
        });

        loadCart();
    </script>
</body>
</html>
