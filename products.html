<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog - Apna Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #ff4757; --dark: #2f3640; --light: #f5f6fa; --white: #ffffff; --shadow: 0 5px 15px rgba(0,0,0,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

        header { background: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .logo h1 { font-size: 20px; font-weight: 700; color: var(--dark); }
        .logo h1 span { color: var(--primary); }
        
        .nav-links { list-style: none; display: flex; gap: 15px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; font-size: 14px; }
        .nav-links a.active, .nav-links a:hover { color: var(--primary); }
        .cart-badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 50px; font-size: 12px; font-weight: 600; }

        .container { padding: 40px 5%; }
        .container h2 { text-align: center; margin-bottom: 25px; font-size: 24px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; text-align: center; }
        .card-body h3 { font-size: 16px; margin-bottom: 5px; }
        .card-body p { font-size: 13px; color: #777; margin-bottom: 10px; }
        .price { font-weight: 700; color: var(--primary); font-size: 16px; margin-bottom: 15px; }

        .btn { padding: 10px 20px; border-radius: 30px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; border: none; cursor: pointer; width: 100%; background: var(--primary); color: white; }
        .btn:hover { opacity: 0.9; }

        footer { background: var(--dark); color: var(--white); text-align: center; padding: 20px; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="a.png" alt="Logo">
                <h1>Apna <span>Mart</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Gifts</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> <span class="cart-badge" id="cartCount">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Gift Items Catalog</h2>
        <div class="grid">
            <div class="card">
                <img src="b.jpeg" alt="Item">
                <div class="card-body">
                    <h3>Spacious Store Hamper</h3>
                    <p>Perfect gift pack</p>
                    <div class="price">₹499</div>
                    <button onclick="addToCart('Spacious Store Hamper', 499, 'b.jpeg')" class="btn"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                </div>
            </div>
            <div class="card">
                <img src="c.png" alt="Item">
                <div class="card-body">
                    <h3>Birthday Celebration Pack</h3>
                    <p>Make birthdays special</p>
                    <div class="price">₹799</div>
                    <button onclick="addToCart('Birthday Celebration Pack', 799, 'c.png')" class="btn"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                </div>
            </div>
            <div class="card">
                <img src="d.png" alt="Item">
                <div class="card-body">
                    <h3>Home Decor Showpiece</h3>
                    <p>Stunning room look</p>
                    <div class="price">₹1,299</div>
                    <button onclick="addToCart('Home Decor Showpiece', 1299, 'd.png')" class="btn"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Apna Mart, Dibiyapur | Owner: Mr. Shyam Sundar Rajput</p>
    </footer>

    <script>
        function addToCart(name, price, image) {
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            let item = cart.find(i => i.name === name);
            if (item) { item.quantity += 1; } else { cart.push({ name, price, image, quantity: 1 }); }
            localStorage.setItem('apnaMartCart', JSON.stringify(cart));
            updateCartCount();
            alert(`✅ "${name}" cart mein add ho gaya hai!`);
        }
        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            document.getElementById('cartCount').innerText = cart.reduce((sum, i) => sum + i.quantity, 0);
        }
        updateCartCount();
    </script>
</body>
</html>
