<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Apna Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #e84118; --dark: #1e272e; --light: #f5f6fa; --white: #ffffff; --gold: #fbc531; --shadow: 0 10px 30px rgba(0,0,0,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.7; }

        header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .logo h1 { font-size: 22px; font-weight: 700; color: var(--dark); font-family: 'Playfair Display', serif; }
        .logo h1 span { color: var(--primary); }
        
        .nav-links { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; font-size: 14px; }
        .nav-links a.active, .nav-links a:hover { color: var(--primary); }
        .cart-badge { background: var(--primary); color: white; padding: 2px 7px; border-radius: 50px; font-size: 11px; font-weight: 600; }

        .container { padding: 50px 5%; display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; }
        .box { background: var(--white); padding: 25px; border-radius: 15px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.04); }
        .box h2 { font-size: 20px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; font-family: 'Playfair Display', serif; }

        .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 13px; outline: none; background: #fafafa; }
        .form-control:focus { border-color: var(--primary); background: #fff; }

        .btn-order { background: #25d366; color: white; padding: 14px; border: none; border-radius: 50px; width: 100%; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; margin-top: 20px; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
        .btn-order:hover { background: #1ebd5a; }

        footer { background: var(--dark); color: var(--white); text-align: center; padding: 25px; font-size: 13px; color: #a4b0be; margin-top: 50px; }

        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="a.png" alt="Logo">
                <h1>Apna <span>Mart</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Catalog</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> <span class="cart-badge" id="cartCount">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="box">
            <h2>Your Shopping Cart</h2>
            <div id="cartItemsList"></div>
        </div>

        <div class="box">
            <h2>Checkout & Address</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label>Aapka Naam (Full Name)</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter mobile" required>
                </div>
                <div class="form-group">
                    <label>Delivery Address / Location in Dibiyapur</label>
                    <textarea id="address" class="form-control" rows="2" placeholder="Phaphund Road, Durga Nagar..." required></textarea>
                </div>
                <div style="font-weight: 700; font-size: 18px; margin: 15px 0;">Total Amount: <span id="grandTotal" style="color:var(--primary);">₹0</span></div>
                <button type="submit" class="btn-order"><i class="fab fa-whatsapp"></i> Confirm Order on WhatsApp</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Apna Mart, Dibiyapur | Proprietor: Mr. Shyam Sundar Rajput</p>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            let list = document.getElementById('cartItemsList');
            let totalEl = document.getElementById('grandTotal');
            
            if (cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#718093; padding:30px;">Aapka cart khaali hai!</p>`;
                totalEl.innerText = "₹0";
                document.getElementById('cartCount').innerText = "0";
                return;
            }

            let html = '', total = 0, count = 0;
            cart.forEach((item, index) => {
                let itemTotal = Number(item.price) * Number(item.quantity);
                total += itemTotal;
                count += Number(item.quantity);
                
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="">
                        <div style="flex-grow:1; padding:0 10px;">
                            <div style="font-size:14px; font-weight:600;">${item.name}</div>
                            <div style="font-size:12px; color:#718093;">₹${item.price} x ${item.quantity} = ₹${itemTotal}</div>
                        </div>
                        <button type="button" onclick="removeItem(${index})" style="background:none; border:none; color:#e84118; cursor:pointer; font-size:16px;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
            
            list.innerHTML = html;
            totalEl.innerText = '₹' + total;
            document.getElementById('cartCount').innerText = count;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('apnaMartCart', JSON.stringify(cart));
            loadCart();
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let cart = JSON.parse(localStorage.getItem('apnaMartCart')) || [];
            if (cart.length === 0) {
                alert('Aapka cart khaali hai!');
                return;
            }

            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let address = document.getElementById('address').value;

            let msg = `🛒 *NEW ORDER - APNA MART* 🎁\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n*Ordered Items:*\n`;
            let total = 0;
            
            cart.forEach((i, idx) => {
                let itemTotal = Number(i.price) * Number(i.quantity);
                total += itemTotal;
                msg += `${idx + 1}. ${i.name} (₹${i.price} x ${i.quantity}) = ₹${itemTotal}\n`;
            });

            msg += `\n*Total Order Amount: ₹${total}*`;

            localStorage.removeItem('apnaMartCart');
            window.open('https://wa.me/918923315930?text=' + encodeURIComponent(msg), '_blank');
            window.location.href = "index.html";
        });

        loadCart();
    </script>
</body>
</html>
